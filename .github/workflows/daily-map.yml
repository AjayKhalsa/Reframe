# Rebuilds the map once a day and commits the result.
#
# The pipeline is offline: it writes `src/lib/data/universe.json` and
# `films.json`, and the app renders whatever those files say. Nothing embeds at
# request time. So "keep the map up to date" means "run the pipeline and commit
# what it produces" — which is what this does, and why it needs write access to
# the repo rather than just an API key.
#
# Vercel deploys from the resulting push. Pushes made with GITHUB_TOKEN do not
# start other *workflows*, but they still fire the push webhook that Vercel's
# GitHub App listens to, so the deploy happens normally.

name: Daily map

on:
  schedule:
    # 09:00 UTC. Gemini's free-tier day rolls over at midnight Pacific, which is
    # 07:00 UTC in summer and 08:00 in winter — this clears both without having
    # to change with the clocks.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: "Skip the TMDB crawl and only embed what is already catalogued"
        type: boolean
        default: false
      provider:
        description: "Embedding provider for this run"
        type: choice
        options: [default, gemini, local]
        default: default

env:
  # Which model builds the map. `local` needs no key and has no daily ceiling,
  # so the job can run on an empty budget; `gemini` is higher quality but caps
  # at roughly a thousand films a day.
  #
  # Set the repository variable EMBED_PROVIDER to change the scheduled default
  # without editing this file. Switching it re-embeds the whole catalogue from
  # scratch — two models' vectors cannot share a map — so the first run after a
  # change is a long one, and on Gemini it is several days of long ones.
  EMBED_PROVIDER: >-
    ${{ inputs.provider != null && inputs.provider != 'default'
        && inputs.provider
        || (vars.EMBED_PROVIDER || 'gemini') }}
  # Outside node_modules, which `npm ci` deletes, so the weights can be cached.
  LOCAL_EMBED_CACHE_DIR: .model-cache

# A run can take a while and the next one must never start on top of it: two
# jobs sharing one embedding budget would spend it twice on the same films.
concurrency:
  group: daily-map
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Ingest crawls a few hundred TMDB pages and the embedder self-throttles to
    # stay under the free tier, so a full run is closer to an hour than a minute.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The pipeline scripts read `.env.local` via `tsx --env-file`, which is
      # the right default locally and simply does not exist on a runner. Writing
      # it from secrets keeps the scripts identical in both places.
      #
      # OPENAI_API_KEY is deliberately absent: `embed` prefers OpenAI whenever a
      # key is set, and OpenAI vectors cannot be mixed with the Gemini ones the
      # committed map is built from. Switching provider is a re-embed of the
      # whole catalogue, not something a scheduled job should do on its own.
      - name: Write .env.local
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ]; then
            echo "::error::TMDB_READ_TOKEN must be set as a repository secret — ingest needs it."
            exit 1
          fi
          # Only the hosted providers need a key. The point of `local` is that
          # the job runs with nothing bought and nothing rationed, so demanding
          # a key it will never read would defeat it.
          if [ "$EMBED_PROVIDER" != "local" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::EMBED_PROVIDER is '$EMBED_PROVIDER' but GEMINI_API_KEY is not set."
            echo "::error::Add the secret, or set the EMBED_PROVIDER variable to 'local'."
            exit 1
          fi
          {
            echo "TMDB_READ_TOKEN=$TMDB_READ_TOKEN"
            echo "TMDB_API_KEY=$TMDB_API_KEY"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
          } > .env.local
          echo "Embedding with: $EMBED_PROVIDER"

      # The embedding cache is the only thing here that cost anything to make —
      # every vector in it is a slice of a daily free-tier allowance that cannot
      # be bought back. Losing it means re-embedding the catalogue at a thousand
      # films a day.
      #
      # `data/vectors.json` is deliberately not cached: it is rebuilt from the
      # cache on every run, and it is the largest file in the directory.
      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: |
            data/catalogue.json
            data/semantic-cache.*.json
          key: reframe-pipeline-${{ github.run_id }}
          restore-keys: reframe-pipeline-

      # Model weights, when running locally. Keyed by provider and model so a
      # switch fetches the new one rather than silently reusing the old.
      - name: Restore model weights
        if: ${{ env.EMBED_PROVIDER == 'local' }}
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: reframe-model-${{ vars.LOCAL_EMBED_MODEL || 'default' }}

      # Cheap, and the only way new releases ever reach the map: the crawl only
      # fetches details for ids it does not already hold.
      - name: Ingest
        if: ${{ inputs.skip_ingest != true }}
        run: npm run ingest

      - name: Embed
        run: npm run embed

      # Refuses to publish a map materially smaller than the committed one, so a
      # lost cache fails the run instead of overwriting the live map with a
      # single day's worth of films. See `refuseToShrink` in scripts/project.ts.
      - name: Project
        run: npm run project

      # Informational. Recall moves as the map grows and a scheduled job is the
      # wrong place to decide that a change is a regression — but the number
      # belongs in the log, where a drop is visible after the fact.
      - name: Evaluate
        continue-on-error: true
        run: npm run evaluate

      - name: Commit the new map
        run: |
          if git diff --quiet -- src/lib/data; then
            echo "Map unchanged — nothing to commit."
            exit 0
          fi

          films=$(node -e "process.stdout.write(String(require('./src/lib/data/universe.json').nodes.length))")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data
          git commit -m "Map: ${films} films"

          # Someone may well have pushed while the pipeline was running.
          for attempt in 1 2 3 4; do
            git push && exit 0
            sleep $((2 ** attempt))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          exit 1
